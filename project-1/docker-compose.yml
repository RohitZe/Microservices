services:

  user-service:
    build: ./user-service
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - backend
    env_file:
      - .env

  data-service:
    build: ./data-service
    ports:
      - "5001:5000"
    depends_on:
      - redis
      - postgres
    networks:
      - backend
    env_file:
      - .env

  postgres:
    image: postgres:13
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata: